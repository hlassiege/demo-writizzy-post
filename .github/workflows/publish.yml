name: Publish to Writizzy

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'assets/**'
      - 'scripts/publish.mjs'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Parse and report without calling the API'
        type: boolean
        default: false

# One publication at a time: two pushes in a row must not race on the same post.
concurrency:
  group: writizzy-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The script diffs the pushed range to find which posts changed, and reads a
          # deleted file from the previous commit to know which post to unpublish.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish the changed posts
        env:
          WRITIZZY_API_KEY: ${{ secrets.WRITIZZY_API_KEY }}
          WRITIZZY_SUBDOMAIN: ${{ vars.WRITIZZY_SUBDOMAIN }}
          WRITIZZY_API_BASE: ${{ vars.WRITIZZY_API_BASE }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          node scripts/publish.mjs \
            ${{ github.event_name == 'workflow_dispatch' && '--all' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
